<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DMチャットモック</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DMモック">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b0b0f">
<style>
  :root{
    --bg:#0b0b0f; --panel:#15151b; --line:#242430;
    --bubble-mine:#3d7dff; --bubble-theirs:#26262f;
    --ink:#f2f2f5; --ink-dim:#8a8a96; --accent:#ff3d7f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Hiragino Sans','Yu Gothic',sans-serif; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  input{ font-family:inherit; }

  #joinPanel{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .join-card{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .join-card h1{ font-size:1.05rem; margin:0 0 6px; }
  .join-card p{ font-size:.78rem; color:var(--ink-dim); margin:0 0 16px; line-height:1.6; }
  .join-card label{ display:block; font-size:.75rem; color:var(--ink-dim); margin:12px 0 5px; }
  .join-card input{ width:100%; padding:11px; border-radius:9px; border:1px solid var(--line); background:#1c1c24; color:var(--ink); font-size:.95rem; }
  .join-card button{ width:100%; margin-top:18px; padding:13px; border:0; border-radius:10px; font-weight:700; font-size:.9rem; background:linear-gradient(120deg,#ff3d7f,#a239ff); color:#fff; }

  #chatScreen{ display:none; min-height:100vh; flex-direction:column; }
  #chatScreen.active{ display:flex; }

  .chat-header{
    position:sticky; top:0; z-index:10; background:rgba(11,11,15,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .chat-avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#ff3d7f,#a239ff); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; }
  .chat-title{ font-size:.92rem; font-weight:700; }
  .chat-sub{ font-size:.68rem; color:var(--ink-dim); }
  .chat-header .settings-btn{ margin-left:auto; background:none; border:0; color:var(--ink-dim); font-size:1.1rem; }

  .messages{ flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:8px; }
  .msg-row{ display:flex; }
  .msg-row.mine{ justify-content:flex-end; }
  .msg-row.theirs{ justify-content:flex-start; }
  .bubble{
    max-width:72%; padding:10px 13px; border-radius:16px; font-size:.88rem; line-height:1.5; word-break:break-word;
    position:relative;
  }
  .msg-row.mine .bubble{ background:var(--bubble-mine); color:#fff; border-bottom-right-radius:4px; }
  .msg-row.theirs .bubble{ background:var(--bubble-theirs); color:var(--ink); border-bottom-left-radius:4px; }
  .msg-meta{ font-size:.62rem; color:var(--ink-dim); margin-top:3px; }
  .msg-row.mine .msg-meta{ text-align:right; }
  .typing-indicator{ font-size:.72rem; color:var(--ink-dim); padding:0 14px 6px; min-height:18px; }

  .composer{
    position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; gap:8px; align-items:center;
  }
  .composer input{
    flex:1; padding:11px 14px; border-radius:999px; border:1px solid var(--line); background:#1c1c24; color:var(--ink); font-size:.9rem;
  }
  .composer button{
    width:40px; height:40px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:1rem; flex-shrink:0;
  }

  .quick-row{ display:flex; gap:8px; overflow-x:auto; padding:0 12px 10px; }
  .quick-chip{ flex-shrink:0; background:#1c1c24; border:1px solid var(--line); color:var(--ink); font-size:.76rem; padding:7px 12px; border-radius:999px; white-space:nowrap; }
</style>
</head>
<body>

<div id="joinPanel">
  <div class="join-card">
    <h1>DMチャットモック</h1>
    <p>2台の端末で同じルームコードを入れると、実際のSNS DMのようにリアルタイムでやり取りできます。</p>
    <label>ルームコード</label>
    <input id="roomInput" placeholder="例:1234">
    <label>自分の表示名</label>
    <input id="myNameInput" placeholder="例:みお">
    <label>相手の表示名(画面上部に表示、任意)</label>
    <input id="theirNameInput" placeholder="例:Riku">
    <button onclick="joinChat()">チャットを開始</button>
  </div>
</div>

<div id="chatScreen">
  <div class="chat-header">
    <div class="chat-avatar" id="headerAvatar">?</div>
    <div>
      <div class="chat-title" id="headerName">相手</div>
      <div class="chat-sub" id="headerSub">オンライン</div>
    </div>
    <button class="settings-btn" onclick="leaveChat()">← 戻る</button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing-indicator" id="typingIndicator"></div>

  <div class="quick-row" id="quickRow"></div>

  <div class="composer">
    <input id="msgInput" placeholder="メッセージを入力…" oninput="notifyTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onChildAdded, set, onValue, remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjsRAOxM0UshGj4Fgvt6TF9eQGTV-Oy4w",
    authDomain: "bare-streaming.firebaseapp.com",
    databaseURL: "https://bare-streaming-default-rtdb.firebaseio.com",
    projectId: "bare-streaming",
    storageBucket: "bare-streaming.firebasestorage.app",
    messagingSenderId: "710961012893",
    appId: "1:710961012893:web:5b4474cc4682fdca753474",
    measurementId: "G-WX1REE1QJ9"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let ROOM = "", MY_NAME = "", THEIR_NAME = "相手";
  let msgUnsub = null, typingUnsub = null;
  let typingTimeout = null;

  const quickPhrases = [
    "ありがとう！","ほんとに会える？","今日暇？","何時なら空いてる？",
    "場所どこがいい？","楽しみにしてる","写真送って","声聞きたいな",
    "本当に来てくれるの？","期待していいの？","今から動ける？"
  ];

  function joinChat(){
    ROOM = (document.getElementById('roomInput').value || "0000").trim();
    MY_NAME = (document.getElementById('myNameInput').value || "自分").trim();
    THEIR_NAME = (document.getElementById('theirNameInput').value || "相手").trim();

    document.getElementById('headerName').textContent = THEIR_NAME;
    document.getElementById('headerAvatar').textContent = THEIR_NAME.charAt(0) || "?";

    document.getElementById('joinPanel').style.display = 'none';
    document.getElementById('chatScreen').classList.add('active');

    buildQuickRow();
    listenMessages();
    listenTyping();
  }

  function leaveChat(){
    if(msgUnsub) msgUnsub();
    if(typingUnsub) typingUnsub();
    document.getElementById('messages').innerHTML = "";
    document.getElementById('chatScreen').classList.remove('active');
    document.getElementById('joinPanel').style.display = 'flex';
  }

  function buildQuickRow(){
    const wrap = document.getElementById('quickRow');
    wrap.innerHTML = "";
    quickPhrases.forEach(text=>{
      const chip = document.createElement('button');
      chip.className = 'quick-chip';
      chip.textContent = text;
      chip.onclick = ()=> sendMessage(text);
      wrap.appendChild(chip);
    });
  }

  function listenMessages(){
    const msgRef = ref(db, "rooms/" + ROOM + "/chat/messages");
    msgUnsub = onChildAdded(msgRef, (snap)=>{
      const m = snap.val();
      if(!m) return;
      renderMessage(m.sender, m.text, m.ts);
    });
  }

  function renderMessage(sender, text, ts){
    const wrap = document.getElementById('messages');
    const mine = sender === MY_NAME;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
    const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "";
    row.innerHTML = `
      <div>
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="msg-meta">${mine ? '' : escapeHtml(sender) + ' ・ '}${time}</div>
      </div>`;
    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function sendMessage(presetText){
    const input = document.getElementById('msgInput');
    const text = (presetText !== undefined ? presetText : input.value.trim());
    if(!text) return;
    push(ref(db, "rooms/" + ROOM + "/chat/messages"), { sender: MY_NAME, text, ts: Date.now() });
    if(presetText === undefined) input.value = "";
    set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), null);
  }

  function notifyTyping(){
    set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{
      set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), null);
    }, 1500);
  }

  function listenTyping(){
    const typingRef = ref(db, "rooms/" + ROOM + "/chat/typing");
    typingUnsub = onValue(typingRef, (snap)=>{
      const val = snap.val() || {};
      const someoneElseTyping = Object.keys(val).some(name => name !== MY_NAME && val[name]);
      document.getElementById('typingIndicator').textContent = someoneElseTyping ? (THEIR_NAME + "が入力中…") : "";
    });
  }

  window.joinChat = joinChat;
  window.leaveChat = leaveChat;
  window.sendMessage = sendMessage;
  window.notifyTyping = notifyTyping;
</script>
</body>
</html>
