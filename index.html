<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DMチャットモック</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DMモック">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#ffffff">
<style>
  :root{
    --bg:#ffffff;
    --header-bg:#ffffff;
    --bubble-mine-bg: linear-gradient(135deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --bubble-mine-text:#ffffff;
    --bubble-theirs-bg:#efefef;
    --bubble-theirs-text:#262626;
    --bubble-radius:20px;
    --accent-solid:#5851db;
    --accent-grad: linear-gradient(90deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --ink:#262626;
    --ink-dim:#8e8e8e;
    --line:#dbdbdb;
  }

  /* ---- テーマ: X風 ---- */
  html.theme-x{
    --bg:#ffffff;
    --header-bg:#ffffff;
    --bubble-mine-bg:#1d9bf0;
    --bubble-mine-text:#ffffff;
    --bubble-theirs-bg:#eff3f4;
    --bubble-theirs-text:#0f1419;
    --bubble-radius:18px;
    --accent-solid:#1d9bf0;
    --accent-grad:#1d9bf0;
    --ink:#0f1419;
    --ink-dim:#536471;
    --line:#e1e8ed;
  }
  html.theme-x.dark{
    --bg:#000000;
    --header-bg:#000000;
    --bubble-mine-bg:#1d9bf0;
    --bubble-mine-text:#ffffff;
    --bubble-theirs-bg:#2f3336;
    --bubble-theirs-text:#e7e9ea;
    --accent-solid:#1d9bf0;
    --accent-grad:#1d9bf0;
    --ink:#e7e9ea;
    --ink-dim:#71767b;
    --line:#2f3336;
  }

  /* ---- テーマ: インスタ風(デフォルト踏襲) ---- */
  html.theme-instagram{
    --bg:#ffffff;
    --header-bg:#ffffff;
    --bubble-mine-bg: linear-gradient(135deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --bubble-mine-text:#ffffff;
    --bubble-theirs-bg:#efefef;
    --bubble-theirs-text:#262626;
    --bubble-radius:20px;
    --accent-solid:#c13584;
    --accent-grad: linear-gradient(90deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --ink:#262626;
    --ink-dim:#8e8e8e;
    --line:#dbdbdb;
  }
  html.theme-instagram.dark{
    --bg:#000000;
    --header-bg:#000000;
    --bubble-mine-bg: linear-gradient(135deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --bubble-mine-text:#ffffff;
    --bubble-theirs-bg:#262626;
    --bubble-theirs-text:#f5f5f5;
    --accent-solid:#c13584;
    --accent-grad: linear-gradient(90deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d);
    --ink:#f5f5f5;
    --ink-dim:#a8a8a8;
    --line:#262626;
  }

  /* ---- テーマ: LINE風 ---- */
  html.theme-line{
    --bg:#e7ede4;
    --header-bg:#ffffff;
    --bubble-mine-bg:#8de055;
    --bubble-mine-text:#1a1a1a;
    --bubble-theirs-bg:#ffffff;
    --bubble-theirs-text:#1a1a1a;
    --bubble-radius:12px;
    --accent-solid:#06c755;
    --accent-grad:#06c755;
    --ink:#1a1a1a;
    --ink-dim:#8c8c8c;
    --line:#d9d9d9;
  }
  html.theme-line.dark{
    --bg:#181f1a;
    --header-bg:#1f2822;
    --bubble-mine-bg:#0bc75c;
    --bubble-mine-text:#0c1f11;
    --bubble-theirs-bg:#293029;
    --bubble-theirs-text:#f0f0f0;
    --accent-solid:#0bc75c;
    --accent-grad:#0bc75c;
    --ink:#f0f0f0;
    --ink-dim:#8c968c;
    --line:#333c34;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif; color:var(--ink); }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  input{ font-family:inherit; }

  /* ---- テーマ選択画面 ---- */
  #themePanel{ height:100%; overflow-y:auto; display:flex; align-items:center; justify-content:center; padding:24px; background:#fafafa; }
  .theme-card{ width:100%; max-width:360px; }
  .theme-card h1{ font-size:1.05rem; margin:0 0 6px; color:#262626; }
  .theme-card p{ font-size:.78rem; color:#8e8e8e; margin:0 0 20px; line-height:1.6; }
  .theme-opt{
    width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:12px;
    border-radius:14px; border:1px solid #e2e2e2; background:#fff; text-align:left;
  }
  .theme-opt:active{ background:#f5f5f5; }
  .theme-dot{ width:34px; height:34px; border-radius:50%; flex-shrink:0; }
  .theme-dot.x{ background:#1d9bf0; }
  .theme-dot.instagram{ background:linear-gradient(135deg,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d); }
  .theme-dot.line{ background:#06c755; }
  .theme-opt-title{ font-size:.9rem; font-weight:700; color:#262626; }
  .theme-opt-sub{ font-size:.72rem; color:#8e8e8e; margin-top:2px; }

  .dark-toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; margin-bottom:14px; background:#fff; border:1px solid #e2e2e2; border-radius:14px; font-size:.85rem; font-weight:700; color:#262626; }
  .switch{ position:relative; display:inline-block; width:44px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{ position:absolute; cursor:pointer; inset:0; background:#d9d9d9; border-radius:999px; transition:.2s; }
  .switch .slider::before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:#262626; }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  #joinPanel{ display:none; height:100%; overflow-y:auto; align-items:center; justify-content:center; padding:24px; background:var(--bg); }
  #joinPanel.active{ display:flex; }
  .join-card{ width:100%; max-width:360px; background:var(--header-bg); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .join-card h1{ font-size:1.05rem; margin:0 0 6px; color:var(--ink); }
  .join-card p{ font-size:.78rem; color:var(--ink-dim); margin:0 0 16px; line-height:1.6; }
  .join-card label{ display:block; font-size:.75rem; color:var(--ink-dim); margin:12px 0 5px; }
  .join-card input{ width:100%; padding:11px; border-radius:9px; border:1px solid var(--line); background:#fafafa; color:var(--ink); font-size:16px; }
  .join-card button.primary{
    width:100%; margin-top:18px; padding:13px; border:0; border-radius:10px; font-weight:700; font-size:.9rem; color:#fff;
    background:var(--accent-grad);
  }
  .join-hint{ font-size:.68rem; color:#aaa; margin-top:10px; line-height:1.6; }
  .clear-check{ display:flex; align-items:center; gap:7px; margin-top:12px; font-size:.72rem; color:var(--ink-dim); }
  .clear-check input{ width:15px; height:15px; margin:0; accent-color:var(--accent-solid); }
  .theme-change-link{ display:block; width:100%; margin-top:14px; padding:10px; border:0; background:none; color:var(--ink-dim); font-size:.75rem; text-align:center; text-decoration:underline; }

  #chatScreen{
    display:none; flex-direction:column; background:var(--bg);
    height:100%; overflow:hidden;
  }
  #chatScreen.active{ display:flex; }

  .chat-header{
    position:relative; z-index:10; background:var(--header-bg); color:var(--ink);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .back-arrow{ background:none; border:0; color:var(--ink); font-size:1.5rem; padding:0 4px; }
  .chat-avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--accent-grad);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:#fff;
  }
  .chat-title{ font-size:.92rem; font-weight:700; color:var(--ink); }
  .chat-sub{ font-size:.68rem; color:var(--ink-dim); }
  .header-actions{ margin-left:auto; display:flex; align-items:center; gap:2px; }

  /* 装飾アイコン(押しても機能はしません) */
  .ig-icon, .line-icon{ display:none; }
  html.theme-instagram .ig-icon{ display:inline-flex; }
  html.theme-line .line-icon{ display:inline-flex; }

  .hdr-icon-btn{
    display:none; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%; border:0; background:none; color:var(--ink); flex-shrink:0;
  }
  .hdr-icon-btn:active{ background:var(--bubble-theirs-bg); }

  .composer .composer-icon-btn{
    display:none; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%; border:0; background:none; color:var(--ink-dim); flex-shrink:0;
  }
  .composer .composer-icon-btn:active{ background:var(--bubble-theirs-bg); }

  .messages{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 12px 6px; display:flex; flex-direction:column; gap:4px; background:var(--bg); }

  .msg-row{ display:flex; align-items:flex-end; gap:6px; margin:2px 0; }
  .msg-row.mine{ justify-content:flex-end; }
  .msg-row.theirs{ justify-content:flex-start; }

  .bubble-wrap{ display:flex; flex-direction:column; max-width:70%; }
  .msg-row.mine .bubble-wrap{ align-items:flex-end; }
  .msg-row.theirs .bubble-wrap{ align-items:flex-start; }

  .bubble{
    padding:10px 14px; border-radius:var(--bubble-radius); font-size:.9rem; line-height:1.4; word-break:break-word;
  }
  .msg-row.mine .bubble{
    background:var(--bubble-mine-bg);
    color:var(--bubble-mine-text); border-bottom-right-radius:6px;
  }
  .msg-row.theirs .bubble{ background:var(--bubble-theirs-bg); color:var(--bubble-theirs-text); border-bottom-left-radius:6px; }

  .msg-time{ font-size:.6rem; color:var(--ink-dim); margin:0 6px; white-space:nowrap; align-self:flex-end; }
  .theirs-name{ font-size:.64rem; color:var(--ink-dim); margin:0 0 2px 4px; }

  .typing-indicator{ font-size:.72rem; color:var(--ink-dim); padding:2px 16px 8px; min-height:20px; }

  .composer{
    position:relative; flex-shrink:0; background:var(--bg); border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; gap:8px; align-items:center;
  }
  .composer input{
    flex:1; min-width:0; padding:11px 16px; border-radius:22px; border:1px solid var(--line); background:#fafafa; color:var(--ink); font-size:16px;
  }
  .composer button{
    width:38px; height:38px; border-radius:50%; border:0; color:#fff; font-size:1rem; flex-shrink:0;
    background:var(--accent-grad);
  }
</style>
</head>
<body>

<div id="themePanel">
  <div class="theme-card">
    <h1>見た目を選んでください</h1>
    <p>あとから「テーマを変更」でいつでも切り替えられます。</p>
    <div class="dark-toggle-row">
      <span>ダークモードで使う</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>
    <button class="theme-opt" onclick="selectTheme('x')">
      <div class="theme-dot x"></div>
      <div>
        <div class="theme-opt-title">X風</div>
        <div class="theme-opt-sub">青バブル・シンプルな配色</div>
      </div>
    </button>
    <button class="theme-opt" onclick="selectTheme('instagram')">
      <div class="theme-dot instagram"></div>
      <div>
        <div class="theme-opt-title">インスタ風</div>
        <div class="theme-opt-sub">グラデーションバブル</div>
      </div>
    </button>
    <button class="theme-opt" onclick="selectTheme('line')">
      <div class="theme-dot line"></div>
      <div>
        <div class="theme-opt-title">LINE風</div>
        <div class="theme-opt-sub">緑バブル・白背景</div>
      </div>
    </button>
  </div>
</div>

<div id="joinPanel">
  <div class="join-card">
    <h1>DMチャットモック</h1>
    <p>2台の端末で同じルームコードを入れると、実際のトーク画面のようにリアルタイムでやり取りできます。</p>
    <label>ルームコード</label>
    <input id="roomInput" placeholder="例:1234">
    <label>自分の表示名</label>
    <input id="myNameInput" placeholder="例:みお">
    <label>相手の表示名(画面上部に表示、任意)</label>
    <input id="theirNameInput" placeholder="例:Riku">
    <button class="primary" onclick="joinChat()">チャットを開始</button>
    <label class="clear-check">
      <input type="checkbox" id="clearOnJoin">
      開始前にこのルームの履歴を消す
    </label>
    <p class="join-hint">※ルームコードと自分の表示名は、必ず半角・全角も含めて2台で完全に一致させてください(例:「1234」と「１２３４」は別物として扱われます)。</p>
    <button class="theme-change-link" onclick="backToThemeSelect()">テーマを変更</button>
  </div>
</div>

<div id="chatScreen">
  <div class="chat-header">
    <button class="back-arrow" onclick="leaveChat()">‹</button>
    <div class="chat-avatar" id="headerAvatar">?</div>
    <div>
      <div class="chat-title" id="headerName">相手</div>
    </div>
    <div class="header-actions">
      <button class="hdr-icon-btn ig-icon line-icon" type="button" title="通話">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="hdr-icon-btn ig-icon line-icon" type="button" title="ビデオ通話">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
      <button class="hdr-icon-btn line-icon" type="button" title="メニュー">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="typing-indicator" id="typingIndicator"></div>

  <div class="composer">
    <button class="composer-icon-btn line-icon" type="button" title="追加">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="composer-icon-btn ig-icon" type="button" title="カメラ">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <input id="msgInput" placeholder="メッセージを入力…" oninput="notifyTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="composer-icon-btn ig-icon" type="button" title="ギャラリー">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button class="composer-icon-btn line-icon" type="button" title="スタンプ">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    </button>
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onChildAdded, set, onValue, remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjsRAOxM0UshGj4Fgvt6TF9eQGTV-Oy4w",
    authDomain: "bare-streaming.firebaseapp.com",
    databaseURL: "https://bare-streaming-default-rtdb.firebaseio.com",
    projectId: "bare-streaming",
    storageBucket: "bare-streaming.firebasestorage.app",
    messagingSenderId: "710961012893",
    appId: "1:710961012893:web:5b4474cc4682fdca753474",
    measurementId: "G-WX1REE1QJ9"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let ROOM = "", MY_NAME = "", THEIR_NAME = "相手";
  let msgUnsub = null, typingUnsub = null;
  let typingTimeout = null;
  let receivedAnyFromOther = false;

  const THEME_KEY = 'dm-mock-theme';
  const DARK_KEY = 'dm-mock-dark';

  function selectTheme(theme){
    const isDark = document.getElementById('darkToggle').checked;
    document.documentElement.classList.remove('theme-x', 'theme-instagram', 'theme-line', 'dark');
    document.documentElement.classList.add('theme-' + theme);
    if(isDark) document.documentElement.classList.add('dark');
    document.getElementById('themePanel').style.display = 'none';
    document.getElementById('joinPanel').classList.add('active');
    try{
      localStorage.setItem(THEME_KEY, theme);
      localStorage.setItem(DARK_KEY, isDark ? '1' : '0');
    }catch(e){}
  }

  function backToThemeSelect(){
    document.getElementById('joinPanel').classList.remove('active');
    document.getElementById('themePanel').style.display = 'flex';
    document.getElementById('darkToggle').checked = document.documentElement.classList.contains('dark');
  }

  // 前回選んだテーマがあれば復元し、テーマ選択はスキップして入室画面へ
  (function initTheme(){
    let saved = null, savedDark = false;
    try{
      saved = localStorage.getItem(THEME_KEY);
      savedDark = localStorage.getItem(DARK_KEY) === '1';
    }catch(e){}
    if(saved){
      document.documentElement.classList.add('theme-' + saved);
      if(savedDark) document.documentElement.classList.add('dark');
      document.getElementById('darkToggle').checked = savedDark;
      document.getElementById('themePanel').style.display = 'none';
      document.getElementById('joinPanel').classList.add('active');
    }
  })();

  function joinChat(){
    ROOM = (document.getElementById('roomInput').value || "0000").trim();
    MY_NAME = (document.getElementById('myNameInput').value || "自分").trim();
    THEIR_NAME = (document.getElementById('theirNameInput').value || "相手").trim();
    const shouldClear = document.getElementById('clearOnJoin').checked;

    document.getElementById('headerName').textContent = THEIR_NAME;
    document.getElementById('headerAvatar').textContent = THEIR_NAME.charAt(0) || "?";

    document.getElementById('joinPanel').classList.remove('active');
    document.getElementById('chatScreen').classList.add('active');

    receivedAnyFromOther = false;

    const startListening = () => {
      listenMessages();
      listenTyping();
    };

    if(shouldClear){
      remove(ref(db, "rooms/" + ROOM + "/chat/messages")).finally(startListening);
    } else {
      startListening();
    }
  }

  function leaveChat(){
    if(msgUnsub) msgUnsub();
    if(typingUnsub) typingUnsub();
    document.getElementById('messages').innerHTML = "";
    document.getElementById('chatScreen').classList.remove('active');
    document.getElementById('joinPanel').classList.add('active');
  }

  function listenMessages(){
    const msgRef = ref(db, "rooms/" + ROOM + "/chat/messages");
    msgUnsub = onChildAdded(msgRef, (snap)=>{
      const m = snap.val();
      if(!m) return;
      if(m.sender !== MY_NAME) receivedAnyFromOther = true;
      renderMessage(m.sender, m.text, m.ts);
    });
  }

  function renderMessage(sender, text, ts){
    const wrap = document.getElementById('messages');
    const mine = sender === MY_NAME;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
    const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "";

    const nameLabel = (!mine) ? `<div class="theirs-name">${escapeHtml(sender)}</div>` : "";
    row.innerHTML = `
      ${mine ? `<span class="msg-time">${time}</span>` : ""}
      <div class="bubble-wrap">
        ${nameLabel}
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
      ${!mine ? `<span class="msg-time">${time}</span>` : ""}
    `;
    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function sendMessage(){
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text) return;
    push(ref(db, "rooms/" + ROOM + "/chat/messages"), { sender: MY_NAME, text, ts: Date.now() });
    input.value = "";
    set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), null);
  }

  function notifyTyping(){
    set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{
      set(ref(db, "rooms/" + ROOM + "/chat/typing/" + MY_NAME), null);
    }, 1500);
  }

  function listenTyping(){
    const typingRef = ref(db, "rooms/" + ROOM + "/chat/typing");
    typingUnsub = onValue(typingRef, (snap)=>{
      const val = snap.val() || {};
      const someoneElseTyping = Object.keys(val).some(name => name !== MY_NAME && val[name]);
      document.getElementById('typingIndicator').textContent = someoneElseTyping ? (THEIR_NAME + "が入力中…") : "";
    });
  }

  window.selectTheme = selectTheme;
  window.backToThemeSelect = backToThemeSelect;
  window.joinChat = joinChat;
  window.leaveChat = leaveChat;
  window.sendMessage = sendMessage;
  window.notifyTyping = notifyTyping;
</script>
</body>
</html>
